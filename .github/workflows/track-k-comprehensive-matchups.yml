name: Track K Comprehensive Efficiency and Matchups

on:
  workflow_dispatch:
  push:
    branches:
      - research/track-k-comprehensive-matchups
    paths:
      - scripts/track_k_comprehensive_matchups.py
      - tests/test_track_k_comprehensive_matchups.py
      - research/track_k_comprehensive_matchups.md
      - .github/workflows/track-k-comprehensive-matchups.yml

permissions:
  contents: read

jobs:
  exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        name: Checkout research branch
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Verify feature construction and paired metrics
        run: PYTHONPATH=scripts python -m pytest -q tests/test_track_k_comprehensive_matchups.py
      - name: Run exploratory historical walk-forward comparison
        run: |
          python scripts/track_k_comprehensive_matchups.py \
            --start-season 2009 \
            --first-test-season 2016 \
            --holdout-start-season 2019 \
            --end-season 2025
      - name: Write experiment summary
        if: always()
        run: |
          if [[ -f outputs/track_k_comprehensive_matchups/summary.md ]]; then
            cat outputs/track_k_comprehensive_matchups/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-k-comprehensive-results
          path: outputs/track_k_comprehensive_matchups/
          if-no-files-found: warn
          retention-days: 90
