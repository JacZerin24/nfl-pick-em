name: Track E Travel Body Clock

on:
  workflow_dispatch:
  push:
    branches:
      - research/travel-body-clock
    paths:
      - "scripts/track_e_travel_body_clock.py"
      - ".github/workflows/track-e-travel-body-clock.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "nflreadpy>=0.1.2" \
            "polars>=1.30" \
            "pandas>=2.2" \
            "numpy>=2.0" \
            "pyarrow>=18" \
            "scikit-learn>=1.6" \
            "catboost>=1.2.8" \
            "lightgbm>=4.6" \
            "scipy>=1.14" \
            "joblib>=1.4" \
            "tabulate>=0.9"

      - name: Validate script syntax
        run: python -m py_compile scripts/track_e_travel_body_clock.py

      - name: Run travel body-clock study
        run: python scripts/track_e_travel_body_clock.py

      - name: Add research summary
        if: always()
        run: |
          if [ -f outputs/track_e_travel_body_clock/summary.md ]; then
            cat outputs/track_e_travel_body_clock/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Track E outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-e-travel-body-clock
          path: outputs/track_e_travel_body_clock
          retention-days: 90
          if-no-files-found: warn
