name: Track F Player Matchups

on:
  workflow_dispatch:
  push:
    branches:
      - research/player-level-matchups
    paths:
      - "scripts/track_f_schema_probe.py"
      - "scripts/track_f_player_matchups.py"
      - "scripts/track_f_consensus_test.py"
      - ".github/workflows/track-f-player-matchups.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "nflreadpy>=0.1.2" \
            "polars>=1.30" \
            "pandas>=2.2" \
            "numpy>=2.0" \
            "pyarrow>=18" \
            "scikit-learn>=1.6" \
            "catboost>=1.2.8" \
            "scipy>=1.14" \
            "joblib>=1.4" \
            "tabulate>=0.9"

      - name: Validate script syntax
        run: |
          python -m py_compile scripts/track_f_schema_probe.py
          python -m py_compile scripts/track_f_player_matchups.py
          python -m py_compile scripts/track_f_consensus_test.py

      - name: Probe player data schemas
        run: python scripts/track_f_schema_probe.py

      - name: Run Track F player matchup study
        run: python scripts/track_f_player_matchups.py

      - name: Run frozen-consensus architecture test
        run: python scripts/track_f_consensus_test.py

      - name: Add research summaries
        if: always()
        run: |
          if [ -f outputs/track_f_player_matchups/summary.md ]; then
            cat outputs/track_f_player_matchups/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/track_f_player_matchups/consensus_summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/track_f_player_matchups/consensus_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Track F outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-f-player-matchups
          path: outputs/track_f_player_matchups
          retention-days: 90
          if-no-files-found: warn
