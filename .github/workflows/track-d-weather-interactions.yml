name: Track D Weather Interactions

on:
  workflow_dispatch:
  push:
    branches:
      - research/weather-interactions
    paths:
      - "scripts/track_d_weather_interactions.py"
      - "scripts/track_d_weather_sensitivity.py"
      - ".github/workflows/track-d-weather-interactions.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "nflreadpy>=0.1.2" \
            "polars>=1.30" \
            "pandas>=2.2" \
            "numpy>=2.0" \
            "pyarrow>=18" \
            "scikit-learn>=1.6" \
            "catboost>=1.2.8" \
            "lightgbm>=4.6" \
            "scipy>=1.14" \
            "joblib>=1.4" \
            "tabulate>=0.9"

      - name: Validate script syntax
        run: |
          python -m py_compile scripts/track_d_weather_interactions.py
          python -m py_compile scripts/track_d_weather_sensitivity.py

      - name: Run weather interaction study
        run: python scripts/track_d_weather_interactions.py

      - name: Run weather sensitivity validation
        run: python scripts/track_d_weather_sensitivity.py

      - name: Add research summary
        if: always()
        run: |
          if [ -f outputs/track_d_weather_interactions/summary.md ]; then
            cat outputs/track_d_weather_interactions/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/track_d_weather_interactions/sensitivity.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/track_d_weather_interactions/sensitivity.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Track D outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-d-weather-interactions
          path: outputs/track_d_weather_interactions
          retention-days: 90
          if-no-files-found: warn
