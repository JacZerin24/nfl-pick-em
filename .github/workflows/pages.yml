name: Deploy Pick'em Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_pages_data.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - "2026 Live NFL Pick'em"
      - "Grade 2026 NFL Pick'em"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build audited dashboard data
        run: python scripts/build_pages_data.py --season 2026 --output site/data/dashboard.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
