name: Track C Player-Value Injuries

on:
  workflow_dispatch:
  push:
    branches:
      - research/player-value-injuries
    paths:
      - "scripts/track_c_player_value_injuries.py"
      - "scripts/track_c_broad_injury_validation.py"
      - "scripts/phase1_backtest.py"
      - "scripts/phase2_injury_value.py"
      - ".github/workflows/track-c-player-value-injuries.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "nflreadpy>=0.1.2" \
            "polars>=1.30" \
            "pandas>=2.2" \
            "numpy>=2.0" \
            "pyarrow>=18" \
            "scikit-learn>=1.6" \
            "catboost>=1.2.8" \
            "lightgbm>=4.6" \
            "scipy>=1.14" \
            "joblib>=1.4" \
            "tabulate>=0.9"

      - name: Validate script syntax
        run: |
          python -m py_compile scripts/track_c_player_value_injuries.py
          python -m py_compile scripts/track_c_broad_injury_validation.py

      - name: Run replacement-aware injury study
        run: python scripts/track_c_player_value_injuries.py

      - name: Validate broad injury comparison signal
        run: python scripts/track_c_broad_injury_validation.py

      - name: Add research summary
        if: always()
        run: |
          if [ -f outputs/track_c_player_value_injuries/summary.md ]; then
            cat outputs/track_c_player_value_injuries/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/track_c_player_value_injuries/broad_injury_validation.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/track_c_player_value_injuries/broad_injury_validation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Track C outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-c-player-value-injuries
          path: outputs/track_c_player_value_injuries
          retention-days: 90
          if-no-files-found: warn
